<div class="tool-surface-inner">
  <div class="form-grid">
    <label>Framework
      <select [(ngModel)]="framework" (ngModelChange)="onFrameworkChange()">
        <option value="angular">Angular</option>
        <option value="react">React</option>
        <option value="vue">Vue</option>
      </select>
    </label>

    @if (framework === 'angular') {
      <label>Angular Pattern
        <select [(ngModel)]="angularPattern">
          <option value="service-method">Single Service Method</option>
          <option value="full-service">Full Injectable Service</option>
          <option value="signals-resource">Angular Signals Resource (rxResource)</option>
        </select>
      </label>
    } @else if (framework === 'react') {
      <label>React Pattern
        <select [(ngModel)]="reactPattern">
          <option value="custom-hook">Custom React Hook</option>
          <option value="rtk-query">RTK Query (Redux Toolkit)</option>
          <option value="redux-thunk">Redux Thunk (createAsyncThunk)</option>
        </select>
      </label>
    } @else if (framework === 'vue') {
      <label>Vue Pattern
        <select [(ngModel)]="vuePattern">
          <option value="composable">Composition API Composable</option>
          <option value="pinia-store">Pinia Store Action</option>
          <option value="context-provider">Provide/Inject API Service</option>
        </select>
      </label>
    }

    <label>HTTP method
      <select [(ngModel)]="method">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>DELETE</option>
      </select>
    </label>

    <label>Endpoint
      <input [(ngModel)]="endpoint" />
    </label>

    <label>Response type
      <input [(ngModel)]="responseType" />
    </label>
  </div>

  <button mat-raised-button color="primary" (click)="generate()">Generate client code</button>

  <div class="field grow">
    <label>Generated code</label>
    <app-code-editor [value]="result()" [language]="outputLanguage" ariaLabel="Generated API client code" [readOnly]="true"></app-code-editor>
  </div>
</div>
