<div class="flex flex-col gap-3.5 w-full mx-auto py-1 pb-6 box-border">

  <!-- Row 1: Framework Selection (Left) & Mode Toggle (Right) -->
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div class="flex items-center gap-2.5 flex-wrap">
      <span class="text-[11px] font-bold uppercase tracking-wide text-[var(--mat-sys-on-surface-variant)]">
        Framework
      </span>
      <mat-button-toggle-group [value]="framework()" (change)="onFrameworkChange($event.value)" aria-label="Framework">
        @for (fw of frameworks; track fw.id) {
        <mat-button-toggle [value]="fw.id" [matTooltip]="fw.label">
          <mat-icon>{{ fw.icon }}</mat-icon>
          <span>{{ fw.label }}</span>
        </mat-button-toggle>
        }
      </mat-button-toggle-group>
    </div>

    <mat-button-toggle-group [value]="mode()" (change)="setMode($event.value)" aria-label="Generation mode">
      <mat-button-toggle value="crud">
        <mat-icon>view_list</mat-icon>
        <span>Full REST CRUD</span>
      </mat-button-toggle>
      <mat-button-toggle value="single">
        <mat-icon>call_made</mat-icon>
        <span>Single Endpoint</span>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <!-- Row 2: Resource Name, Endpoint, HTTP Method (if Single), Pattern -->
  <div class="controls-grid"
    [style.grid-template-columns]="mode() === 'single' ? '1fr 1.8fr 110px 1.6fr' : '1fr 2fr 1.6fr'">
    <label>
      <span>Resource Name</span>
      <input type="text" [ngModel]="resourceName()" (ngModelChange)="resourceName.set($event)"
        placeholder="Product, User, Order" />
    </label>

    <label>
      <span>Endpoint</span>
      <input type="text" class="font-mono" [ngModel]="endpoint()" (ngModelChange)="endpoint.set($event)"
        placeholder="/api/products or /api/users/{id}" />
    </label>

    @if (mode() === 'single') {
    <label>
      <span>Method</span>
      <select [ngModel]="method()" (ngModelChange)="method.set($event)">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>
    </label>
    }

    <label>
      <span>Pattern</span>
      <select [ngModel]="pattern()" (ngModelChange)="pattern.set($event)">
        @for (pat of availablePatterns(); track pat.id) {
        <option [value]="pat.id">{{ pat.label }}</option>
        }
      </select>
    </label>
  </div>

  <!-- Row 3: Options -->
  <div class="options-row">
    <label class="checkbox-label">
      <input type="checkbox" [ngModel]="includeErrorHandling()" (ngModelChange)="includeErrorHandling.set($event)" />
      <span>Error Handling</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" [ngModel]="includeCancellation()" (ngModelChange)="includeCancellation.set($event)" />
      <span>Cancellation (Abort)</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" [ngModel]="includeAuth()" (ngModelChange)="includeAuth.set($event)" />
      <span>Auth Bearer Header</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" [ngModel]="includePagination()" (ngModelChange)="includePagination.set($event)" />
      <span>Pagination & Filters</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" [ngModel]="includeTsDoc()" (ngModelChange)="includeTsDoc.set($event)" />
      <span>TSDoc Comments</span>
    </label>
  </div>

  <!-- Output Card -->
  <div class="flex flex-col overflow-hidden rounded-lg min-h-[520px] h-[550px]
              bg-[var(--mat-sys-surface-container-low)] border border-[var(--mat-sys-outline-variant)]">
    <div class="flex items-center justify-between gap-3 flex-wrap px-3
                bg-[var(--mat-sys-surface-container)] border-b border-[var(--mat-sys-outline-variant)] shrink-0">
      <mat-button-toggle-group [value]="activeTab()" (change)="activeTab.set($event.value)"
        class="output-tabs-toggle !border-0 !bg-transparent" aria-label="Output tab">
        @for (tab of outputTabs; track tab.id) {
        <mat-button-toggle [value]="tab.id">
          <mat-icon>{{ tab.icon }}</mat-icon>
          <span>{{ tab.label }}</span>
        </mat-button-toggle>
        }
      </mat-button-toggle-group>

      <div class="flex items-center gap-2 py-1.5">
        <button mat-stroked-button (click)="copyCode()" matTooltip="Copy generated code">
          <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
          {{ copied() ? 'Copied!' : 'Copy' }}
        </button>
        <button mat-stroked-button (click)="downloadCode()" matTooltip="Download as file">
          <mat-icon>download</mat-icon>
          Download
        </button>
      </div>
    </div>

    <!-- Monaco Code Editor Surface -->
    <div class="editor-wrapper">
      <app-code-editor class="generated-editor" [value]="activeCode()" [language]="editorLanguage()" [readOnly]="true"
        wordWrap="on" ariaLabel="Generated API client code">
      </app-code-editor>
    </div>
  </div>
</div>
