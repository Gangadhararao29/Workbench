<div class="tool-surface-inner"><div class="form-grid"><label>Framework<select [(ngModel)]="framework"><option value="angular">Angular service</option><option value="react">React hook</option><option value="vue">Vue composable</option></select></label><label>HTTP method<select [(ngModel)]="method"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option></select></label><label>Endpoint<input [(ngModel)]="endpoint" /></label><label>Response type<input [(ngModel)]="responseType" /></label></div><button mat-raised-button color="primary" (click)="generate()">Generate client code</button><pre class="code-result">{{ result() }}</pre></div>
