<div class="tool-surface-inner"><div class="field"><label>Script name</label><input [(ngModel)]="scriptName" class="text-input" /></div><div class="field"><label>Inputs (JSON)</label><app-code-editor [value]="inputs" language="json" ariaLabel="Script inputs" (valueChange)="inputs = $event"></app-code-editor></div><div class="field"><label>JavaScript</label><app-code-editor [value]="script" language="javascript" ariaLabel="JavaScript source" (valueChange)="script = $event"></app-code-editor></div><div class="actions"><button mat-raised-button color="primary" (click)="execute()">Execute</button><button mat-stroked-button (click)="reset()">Reset</button><button mat-stroked-button (click)="exportDefinition()">Export JSON</button><button mat-stroked-button (click)="importDefinition()">Import JSON</button></div><div class="field"><label>Definition JSON</label><app-code-editor [value]="definition()" language="json" ariaLabel="Script definition" (valueChange)="definition.set($event)"></app-code-editor></div><div class="field grow"><label>Output</label><pre class="code-result">{{ result() }}</pre></div></div>
