<div class="tool-surface-inner"><h1>Documentation Hub</h1>@for(group of groups;track group.name){<section><h2>{{group.name}}</h2><div class="doc-grid">@for(link of group.links;track link.url){<a class="doc-card" [href]="link.url" target="_blank" rel="noreferrer"><strong>{{link.name}}</strong><span>{{link.description}}</span><small>Open official documentation</small></a>}</div></section>}</div>
