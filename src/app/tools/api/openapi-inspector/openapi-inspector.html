<div class="tool-surface-inner"><div class="field"><label>OpenAPI JSON</label><app-code-editor [value]="input()" language="json" ariaLabel="OpenAPI JSON" (valueChange)="input.set($event)"></app-code-editor></div><button mat-raised-button color="primary" (click)="inspect()">Inspect OpenAPI</button>@if(error()){<p class="error">{{error()}}</p>}<section><h2>Endpoints</h2><div class="endpoint-list">@for(endpoint of endpoints();track endpoint.method+endpoint.path){<div class="endpoint"><strong>{{endpoint.method}}</strong><code>{{endpoint.path}}</code><span>{{endpoint.summary}}</span></div>}@empty{<p>No endpoints found.</p>}</div></section><section><h2>Schemas</h2><p>{{schemas().length ? schemas().join(', ') : 'No schemas found.'}}</p></section></div>
