<div class="tool-surface-inner"><div class="request-line"><select [(ngModel)]="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input [(ngModel)]="url" placeholder="https://api.example.com/items" /></div><div class="field"><label>Query parameters</label><textarea rows="4" [(ngModel)]="query" class="code-input" placeholder="page=1&#10;pageSize=20"></textarea></div><div class="field"><label>Headers</label><textarea rows="5" [(ngModel)]="headers" class="code-input" placeholder="Authorization: Bearer token"></textarea></div><div class="field"><label>JSON body</label><textarea rows="7" [(ngModel)]="body" class="code-input"></textarea></div><button mat-raised-button color="primary" [disabled]="loading()" (click)="send()">{{ loading() ? 'Sending...' : 'Send request' }}</button><pre class="code-result">{{ result() }}</pre></div>
