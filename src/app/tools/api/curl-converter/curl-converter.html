<div class="tool-surface-inner">
  <div class="field">
    <label>cURL input</label>
    <app-code-editor [value]="input()" language="plaintext" ariaLabel="cURL input" (valueChange)="input.set($event)"></app-code-editor>
  </div>
  <div class="target-row">
    <label>Generate for
      <select [(ngModel)]="target">
        <option value="csharp">C# HttpClient</option>
        <option value="restsharp">C# RestSharp</option>
        <option value="fetch">JavaScript fetch</option>
        <option value="axios">Axios</option>
        <option value="angular">Angular HttpClient</option>
      </select>
    </label>
    <button mat-raised-button color="primary" (click)="convert()">Convert</button>
  </div>
  <div class="field grow">
    <label>Generated code</label>
    <app-code-editor [value]="result()" [language]="outputLanguage()" ariaLabel="Generated code output" [readOnly]="true"></app-code-editor>
  </div>
</div>
