<div class="tool-surface-inner">
  <div class="field">
    <label>C# entity</label>
    <app-code-editor [value]="input()" language="csharp" ariaLabel="C# entity input" (valueChange)="input.set($event)"></app-code-editor>
  </div>
  <button mat-raised-button color="primary" (click)="generate()">Generate EF configuration</button>
  <div class="field grow">
    <label>EF configuration output</label>
    <app-code-editor [value]="result()" language="csharp" ariaLabel="EF configuration output" [readOnly]="true"></app-code-editor>
  </div>
</div>
