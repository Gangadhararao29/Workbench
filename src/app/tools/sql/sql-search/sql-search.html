<div class="tool-surface-inner"><div class="search-row"><input [(ngModel)]="query" (input)="search()" placeholder="Search duplicates, pagination, latest record..." /></div><div class="pattern-list">@for (pattern of results(); track pattern.title) {<article class="pattern"><div class="pattern-heading"><h2>{{ pattern.title }}</h2><span>{{ pattern.database }}</span></div><p>{{ pattern.description }}</p><small>{{ pattern.tags }}</small><pre>{{ pattern.sql }}</pre></article>} @empty {<p>No matching SQL patterns.</p>}</div></div>
