<div class="tool-surface-inner">
	<div class="search-row">
		<input [(ngModel)]="query" (input)="search()" placeholder="Search indexes, column usage, table links, reference data..." />
	</div>
	<div class="pattern-list">
		@for (pattern of results(); track pattern.title) {
			<article class="pattern">
				<div class="pattern-heading"><h2>{{ pattern.title }}</h2><span>{{ pattern.category }}</span></div>
				<p>{{ pattern.description }}</p>
				<div class="pattern-meta"><small>{{ pattern.database }}</small><small>{{ pattern.tags }}</small></div>
				<pre>{{ pattern.sql }}</pre>
			</article>
		} @empty {
			<p>No matching SQL patterns.</p>
		}
	</div>
</div>
