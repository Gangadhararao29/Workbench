<div class="tool-surface-inner">
  <div class="form-grid">
    <label class="field-table">
      Table name
      <input [(ngModel)]="table" (ngModelChange)="generate()" />
    </label>

    <label class="field-filter">
      Filter column
      <input [(ngModel)]="whereColumn" (ngModelChange)="generate()" />
    </label>

    <label class="field-page-size">
      Page size
      <input type="number" min="1" [(ngModel)]="pageSize" (ngModelChange)="generate()" />
    </label>

    <label class="field-columns">
      Columns
      <textarea [(ngModel)]="columns" (ngModelChange)="generate()"></textarea>
    </label>

    <label class="field-join-table">
      Join table (optional)
      <input [(ngModel)]="joinTable" (ngModelChange)="generate()" />
    </label>

    <label class="field-join-col">
      Join column
      <input [(ngModel)]="joinColumn" (ngModelChange)="generate()" />
    </label>
  </div>

  <button mat-raised-button color="primary" (click)="generate()">Generate SQL</button>

  <div class="field grow">
    <label>Generated SQL</label>
    <app-code-editor [value]="result()" language="sql" ariaLabel="Generated SQL output" [readOnly]="true"></app-code-editor>
  </div>
</div>
