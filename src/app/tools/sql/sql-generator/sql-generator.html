<div class="tool-surface-inner"><div class="form-grid"><label>Table name<input [(ngModel)]="table" /></label><label>Columns<textarea rows="8" [(ngModel)]="columns"></textarea></label><label>Filter column<input [(ngModel)]="whereColumn" /></label><label>Page size<input type="number" min="1" [(ngModel)]="pageSize" /></label><label>Join table (optional)<input [(ngModel)]="joinTable" /></label><label>Join column<input [(ngModel)]="joinColumn" /></label></div><button mat-raised-button color="primary" (click)="generate()">Generate SQL</button><pre class="code-result">{{ result() }}</pre></div>
