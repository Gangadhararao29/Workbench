<div class="flex flex-col min-h-screen gap-4 box-border">

  <div class="grid grid-cols-2 grid-rows-3 gap-3">
    <div class="col-start-1 row-start-1 form">
      <label>
        Table name
        <input [(ngModel)]="table" (ngModelChange)="generate()" />
      </label>
    </div>
    <div class="col-start-1 row-start-2 form">
      <label>
        Filter column
        <input [(ngModel)]="whereColumn" (ngModelChange)="generate()" />
      </label>
    </div>
    <div class="col-start-1 row-start-3 form">
      <label>
        Page size
        <input type="number" min="1" [(ngModel)]="pageSize" (ngModelChange)="generate()" />
      </label>
    </div>

    <!-- Right column: single block spanning all 3 rows -->
    <div class="col-start-2 row-start-1 row-span-3 form">
      <label>
        Columns
        <textarea [(ngModel)]="columns" (ngModelChange)="generate()"></textarea>
      </label>
    </div>

    <div class="col-start-1 row-start-4 form">
      <label>
        Join table (optional)
        <input [(ngModel)]="joinTable" (ngModelChange)="generate()" />
      </label>
    </div>

    <div class="col-start-2 row-start-4 form">
      <label>
        Join column
        <input [(ngModel)]="joinColumn" (ngModelChange)="generate()" />
      </label>
    </div>


  </div>


  <button mat-raised-button color="primary" (click)="generate()">Generate SQL</button>

  <div class="field grow">
    <label>Generated SQL</label>
    <app-code-editor [value]="result()" language="sql" ariaLabel="Generated SQL output"
      [readOnly]="true"></app-code-editor>
  </div>
</div>
