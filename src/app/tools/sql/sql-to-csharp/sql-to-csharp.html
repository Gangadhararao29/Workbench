<div class="tool-surface-inner">
  <div class="field">
    <label>SQL input</label>
    <app-code-editor [value]="input()" language="sql" ariaLabel="SQL input" (valueChange)="input.set($event)"></app-code-editor>
  </div>
  <button mat-raised-button color="primary" (click)="convert()">Convert to C#</button>
  <div class="field grow">
    <label>C# output</label>
    <app-code-editor [value]="result()" language="csharp" ariaLabel="C# output" [readOnly]="true"></app-code-editor>
  </div>
</div>
