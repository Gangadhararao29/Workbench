<div class="tool-surface-inner">
  <div class="field">
    <label>C# input</label>
    <app-code-editor [value]="input()" language="csharp" ariaLabel="C# input" (valueChange)="input.set($event)"></app-code-editor>
  </div>
  <button mat-raised-button color="primary" (click)="format()">Format C#</button>
  <div class="field grow">
    <label>Formatted output</label>
    <app-code-editor [value]="result()" language="csharp" ariaLabel="Formatted C# output" [readOnly]="true"></app-code-editor>
  </div>
</div>
