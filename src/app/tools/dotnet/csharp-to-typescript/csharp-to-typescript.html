<div class="tool-surface-inner">
  <div class="field">
    <label>C# input</label>
    <app-code-editor
      [value]="input()"
      language="csharp"
      ariaLabel="C# input"
      (valueChange)="input.set($event)"
    ></app-code-editor>
  </div>

  <button mat-raised-button color="primary" (click)="format()">Convert to TypeScript</button>

  <div class="field grow">
    <label>TypeScript output</label>
    <app-code-editor [value]="result()" language="typescript" ariaLabel="TypeScript output" [readOnly]="true"></app-code-editor>
  </div>
</div>
