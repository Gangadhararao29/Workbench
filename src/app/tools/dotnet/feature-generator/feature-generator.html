<div class="tool-surface-inner">
	<div class="form-grid">
		<label>Feature name<input [(ngModel)]="feature" (ngModelChange)="generate()" /></label>
		<label>Namespace<input [(ngModel)]="namespace" (ngModelChange)="generate()" /></label>
	</div>

	<div class="field grow">
		<label>Generated code</label>
		<app-code-editor [value]="result()" language="csharp" ariaLabel="Generated feature code" [readOnly]="true"></app-code-editor>
	</div>
</div>
