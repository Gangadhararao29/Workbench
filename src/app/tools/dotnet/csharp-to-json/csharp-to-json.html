<div class="tool-surface-inner">
  <div class="field">
    <label>C# input</label>
    <app-code-editor [value]="input()" language="csharp" ariaLabel="C# input" (valueChange)="input.set($event)"></app-code-editor>
  </div>
  <button mat-raised-button color="primary" (click)="convert()">Generate JSON example</button>
  <div class="field grow">
    <label>JSON output</label>
    <app-code-editor [value]="result()" language="json" ariaLabel="JSON output" [readOnly]="true"></app-code-editor>
  </div>
</div>
