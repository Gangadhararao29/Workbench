<div class="tool-surface-inner">

  <div class="field">
    <div class="field-header">
      <label>JSON Input</label>
      <div class="input-actions">
        <button type="button" class="action-link-btn" (click)="input.set('')">
          <mat-icon>clear_all</mat-icon>
          <span>Clear</span>
        </button>
      </div>
    </div>
    <app-code-editor [value]="input()" language="json" ariaLabel="JSON input"
      (valueChange)="input.set($event)"></app-code-editor>
  </div>

  <div class="toolbar-row">
    <div class="result-header">
      <span class="result-label">Result</span>
      <button class="btn-copy-result" [class.copied]="copied()" (click)="copyResult()" title="Copy result">
        <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
      </button>
    </div>
    <div class="format-actions">
      <button mat-stroked-button (click)="validate()">
        <mat-icon>check_circle</mat-icon>
        <span>Validate</span>
      </button>
      <button mat-stroked-button (click)="minify()">
        <mat-icon>compress</mat-icon>
        <span>Minify</span>
      </button>
      <button mat-flat-button color="primary" (click)="format()">
        <mat-icon>auto_fix_high</mat-icon>
        <span>Format</span>
      </button>
    </div>
  </div>

  @if (status()) {
    <p class="status-message" [class.error-message]="status().startsWith('Invalid')">{{ status() }}</p>
  }

  <div class="field grow">
    <app-code-editor [value]="result()" language="json" ariaLabel="JSON result" [readOnly]="true"></app-code-editor>
  </div>

</div>
