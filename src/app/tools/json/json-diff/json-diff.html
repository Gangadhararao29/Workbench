<div class="tool-surface-inner">

  <!-- Options + Compare bar -->
  <div class="toolbar-row">
    <div class="format-actions">
      <!-- Array comparison mode -->
      <div class="diff-mode-group">
        <span class="result-label" style="margin-right: 4px;">Arrays:</span>
        <button type="button" class="seg-btn" [class.active-mode]="arrayMode() === 'key'"
          (click)="setArrayMode('key')">By Key</button>
        <button type="button" class="seg-btn" [class.active-mode]="arrayMode() === 'index'"
          (click)="setArrayMode('index')">By Index</button>
      </div>

      @if (arrayMode() === 'key') {
      <div class="key-field-inline">
        <label for="array-key-field" class="result-label">Key:</label>
        <input id="array-key-field" type="text" class="inline-input" [ngModel]="arrayKeyField()"
          (ngModelChange)="arrayKeyField.set($event); compare()" placeholder="id, name…" />
      </div>
      }


    </div>
    <span class="result-label">
      <button mat-flat-button color="primary" (click)="compare()">
        <mat-icon>difference</mat-icon>
        <span>Compare</span>
      </button>
    </span>
  </div>

  <!-- Side-by-side editors -->
  <div class="diff-grid">
    <div class="field">
      <div class="field-header"><label>JSON A</label></div>
      <app-code-editor [value]="left()" language="json" ariaLabel="JSON A"
        (valueChange)="left.set($event); compare()"></app-code-editor>
    </div>
    <div class="field">
      <div class="field-header"><label>JSON B</label></div>
      <app-code-editor [value]="right()" language="json" ariaLabel="JSON B"
        (valueChange)="right.set($event); compare()"></app-code-editor>
    </div>
  </div>

  <!-- Diff result fills remaining height -->
  <div class="field grow">
    <app-code-editor [value]="result()" language="plaintext" ariaLabel="Diff result"
      [readOnly]="true"></app-code-editor>
  </div>

</div>
