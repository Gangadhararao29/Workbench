<div class="app-shell">

  <!-- Navbar -->
  <mat-toolbar class="app-toolbar">
    <div class="toolbar-left">
      <mat-icon>terminal</mat-icon>
      <button class="toolbar-brand" (click)="goHome()" matTooltip="Workbench Home" aria-label="Go to Workbench home">
        Workbench
      </button>
    </div>

    <div class="toolbar-right">
      <input
        type="text"
        placeholder="Search tools…"
        class="search-input"
        [value]="shellState.searchQuery()"
        (input)="shellState.searchQuery.set($any($event.target).value)"
      />

      <button mat-icon-button (click)="toggleLeft()" matTooltip="Toggle tools panel" aria-label="Toggle tools panel">
        <mat-icon>dock_to_right</mat-icon>
      </button>
      <button
        mat-icon-button
        (click)="toggleRight()"
        [disabled]="!shellState.hasOptions()"
        matTooltip="Toggle options panel"
        aria-label="Toggle options panel"
      >
        <mat-icon>dock_to_left</mat-icon>
      </button>
      <button mat-icon-button (click)="toggleTheme()" matTooltip="Toggle theme" aria-label="Toggle theme">
        <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <!-- Sidenav container -->
  <mat-sidenav-container class="body-container">

    <!-- Left Drawer (Sidebar) -->
    <mat-sidenav #leftDrawer mode="side" opened class="left-panel">
      <app-tool-sidebar
        [searchQuery]="shellState.searchQuery()"
        [hasOpenTools]="instanceService.instances().length > 0"
        (openTool)="openTool($event.toolType, $event.groupId)"
        (closeAll)="closeAllTools()"
        (home)="goHome()"
      />
    </mat-sidenav>

    <!-- Center Content (Router Outlet) -->
    <mat-sidenav-content class="center-content">
      <router-outlet />
    </mat-sidenav-content>

    <!-- Right Drawer (Options Panel) -->
    <mat-sidenav
      #rightDrawer
      mode="side"
      [opened]="shellState.rightDrawerOpened()"
      (openedChange)="shellState.setRightDrawer($event)"
      position="end"
      class="right-panel"
    >
      @if (shellState.selectedInstance()) {
        <app-options-panel [instance]="shellState.selectedInstance()!" />
      }
    </mat-sidenav>

  </mat-sidenav-container>

</div>
