<div class="sidebar-header">
  <span>Tools</span>
  @if (hasOpenTools) {
    <button mat-icon-button #closeAllTip="matTooltip" matTooltip="Close all tools" matTooltipPosition="right" aria-label="Close all tools" (click)="closeAllTip.hide(0); closeAll.emit()">
      <mat-icon>close</mat-icon>
    </button>
  }
</div>

<mat-accordion multi="true" displayMode="flat">
  @for (group of filteredGroups; track group.id) {
    <mat-expansion-panel [expanded]="group.id === 'json'">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon class="group-icon">{{ group.icon }}</mat-icon>
          {{ group.label }}
        </mat-panel-title>
      </mat-expansion-panel-header>

      @for (tool of group.tools; track tool.type) {
        <div class="tool-row" (click)="descTip.hide(0); emit(tool.type, group.id)">
          <span
            class="tool-label"
            #descTip="matTooltip"
            [matTooltip]="tool.description"
            matTooltipPosition="right"
            matTooltipShowDelay="300"
            matTooltipHideDelay="0"
          >{{ tool.label }}</span>
          <button
            mat-icon-button
            class="favorite-btn"
            #favTip="matTooltip"
            [matTooltip]="isFavorite(tool.type) ? 'Remove from favorites' : 'Add to favorites'"
            matTooltipPosition="right"
            matTooltipTouchGestures="off"
            [attr.aria-label]="isFavorite(tool.type) ? 'Remove from favorites' : 'Add to favorites'"
            (click)="toggleFavorite(tool.type); favTip.hide(0); $event.stopPropagation()"
          >
            <mat-icon class="favorite-icon" [class.favorite-active]="isFavorite(tool.type)" inline="true">
              {{ isFavorite(tool.type) ? 'star' : 'star_border' }}
            </mat-icon>
          </button>
        </div>
      }
    </mat-expansion-panel>
  }
</mat-accordion>
