<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e69de" />
      <stop offset="100%" stop-color="#0a3580" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="38" fill="url(#bg-grad)"/>
  <rect x="4" y="4" width="184" height="184" rx="34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
  
  <!-- Outer white strokes for 3D overlap effect -->
  <path d="M46 56 L82 136 L108 82" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M84 82 L110 136 L146 56" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Inner background-colored strokes to make them hollow ribbons -->
  <path d="M46 56 L82 136 L108 82" fill="none" stroke="url(#bg-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 82 L110 136 L146 56" fill="none" stroke="url(#bg-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
